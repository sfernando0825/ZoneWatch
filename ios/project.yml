name: ZoneWatch

options:
  bundleIdPrefix: com.zonewatch
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Set your Apple team ID here (or in Xcode) once enrolled in the Apple Developer Program.
    DEVELOPMENT_TEAM: ""

packages:
  ZoneWatchKit:
    path: ZoneWatchKit

targets:
  ZoneWatch:
    type: application
    platform: iOS
    sources:
      - ZoneWatch
      # Replay with Debug > Simulate Location in Xcode; not bundled in the app.
      - path: TestRoutes
        buildPhase: none
    dependencies:
      - package: ZoneWatchKit
      - target: ZoneWatchLiveActivity
    entitlements:
      path: ZoneWatch/ZoneWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zonewatch.app
    info:
      path: ZoneWatch/Info.plist
      properties:
        CFBundleDisplayName: ZoneWatch
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - location
          - audio
        NSSupportsLiveActivities: true
        # Drive logs and GPX tracks appear in the Files app for the Phase 1 drive tests.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSLocationWhenInUseUsageDescription: ZoneWatch uses your location to warn you of speed cameras ahead while you drive.
        NSLocationAlwaysAndWhenInUseUsageDescription: ZoneWatch warns you of speed cameras while driving, including when your screen is locked or another app is open.
        NSMotionUsageDescription: ZoneWatch uses motion activity to detect when you start driving, so camera alerts turn on without you touching the phone.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zonewatch.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  ZoneWatchLiveActivity:
    type: app-extension
    platform: iOS
    # iOS 18 for the small Live Activity family (CarPlay Dashboard). The app itself stays on iOS 17.
    deploymentTarget: "18.0"
    sources:
      - ZoneWatchLiveActivity
    dependencies:
      - package: ZoneWatchKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: ZoneWatchLiveActivity/ZoneWatchLiveActivity.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zonewatch.app
    info:
      path: ZoneWatchLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: ZoneWatch
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zonewatch.app.LiveActivity
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  ZoneWatch:
    build:
      targets:
        ZoneWatch: all
        ZoneWatchLiveActivity: all
    run:
      config: Debug
    archive:
      config: Release
